<!doctype html><html><head><meta charset="utf-8"><title>Memories</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#111827;font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.slide{width:1600px;height:900px;padding:44px 56px;overflow:hidden}
h1{font-size:38px;margin:0 0 6px}.sub{font-size:20px;color:#6b7280;margin:0 0 22px}
.m-grid{display:grid;grid-template-columns:760px 1fr;gap:26px}
.card{border:1px solid #e5e7eb;border-radius:12px;padding:16px 18px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.col{display:flex;flex-direction:column;gap:14px}
.tag{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:#6b7280;font-weight:700;margin-bottom:10px}
.tag2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:#6b7280;margin-bottom:4px}
.acc{color:#2563eb}.acc2{color:#b45309}
.prompt{font-size:17px;line-height:1.45}.mono{color:#4b5563;margin:8px 0}
.fixed{background:#f3f4f6;border-radius:8px;padding:10px 12px}
.slot{border:2.5px dashed #2563eb;border-radius:8px;padding:10px 12px;margin:10px 0;background:#eff6ff}
.slot.q1{border-color:#d97706;background:#fffbeb}
table.st{border-collapse:collapse;width:100%;font-size:16px}table.st th{text-align:left;color:#6b7280;font-weight:600;border-bottom:1px solid #e5e7eb;padding:4px 6px}
table.st td{padding:5px 6px;border-bottom:1px solid #f3f4f6}table.st td:nth-child(3),table.st td:nth-child(4),table.st th:nth-child(3),table.st th:nth-child(4){text-align:right}
.note{font-size:14px;color:#6b7280;margin-top:8px}
.qs{display:grid;grid-template-columns:1.25fr 1fr;gap:6px 16px}.qg{display:flex;flex-direction:column;gap:5px}
.qg:nth-child(3){grid-column:2}.qg:nth-child(2){grid-column:2;grid-row:1}.qg:nth-child(1){grid-row:1/3}
.qh{font-size:13px;font-weight:700;color:#b45309;text-transform:uppercase;letter-spacing:.05em}
.q{font-size:14.5px;line-height:1.3}.q span{color:#4b5563}.hr{font-size:12px;background:#fef3c7;color:#92400e!important;border-radius:4px;padding:0 5px}
.model{font-size:15.5px;background:#f9fafb}
</style></head><body><div class="slide"><h1>Each memory implies a different value of an hour</h1><p class="sub">Most memories are one-sided bounds: a choice reveals that an hour is worth <i>at least</i> or <i>at most</i> some amount.</p><div style="font-size:17px;color:#374151"><span style="display:inline-flex;align-items:center;gap:6px;margin-right:22px"><span style="width:14px;height:14px;border-radius:50%;background:#0f766e;display:inline-block"></span><b>Floor</b>: paid money to save time → hour worth <i>at least</i> this</span><span style="display:inline-flex;align-items:center;gap:6px;margin-right:22px"><span style="width:14px;height:14px;border-radius:50%;background:#c2410c;display:inline-block"></span><b>Ceiling</b>: spent time to save money → hour worth <i>at most</i> this</span><span style="display:inline-flex;align-items:center;gap:6px;margin-right:22px"><span style="width:14px;height:14px;border-radius:50%;background:#6d28d9;display:inline-block"></span><b>Exact</b>: wage</span></div><div style="margin-top:6px"><svg viewBox="0 0 1490 686" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><defs><marker id="ar0f766e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker><marker id="arc2410c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker></defs><line x1="845" y1="26" x2="845" y2="616" stroke="#9ca3af" stroke-dasharray="5 5"/><text x="851" y="22" font-size="15" fill="#6b7280">model's answer with no memory ≈ $20/h</text><rect x="0" y="40.0" width="1490" height="64" fill="#f9fafb"/><text x="10" y="68.0" font-size="19" fill="#111827"><tspan font-weight="700">C</tspan>  Paid $30 for a Disneyland skip-the-line pass (saves ~2 h)</text><text x="34" y="92.0" font-size="15" fill="#6b7280">$30 ÷ 2 h  ·  also fun / vacation</text><line x1="781" y1="72.0" x2="1450" y2="72.0" stroke="#0f766e" stroke-width="5" stroke-opacity=".35" marker-end="url(#ar0f766e)"/><circle cx="781" cy="72.0" r="9" fill="#0f766e"/><text x="795" y="60.0" font-size="19" font-weight="700" fill="#0f766e" text-anchor="start">≥ $15/h</text><text x="10" y="132.0" font-size="19" fill="#111827"><tspan font-weight="700">I</tspan>  Drove 10 extra min to save $3 on gas</text><text x="34" y="156.0" font-size="15" fill="#6b7280">$3 ÷ 10 min</text><line x1="821" y1="136.0" x2="690" y2="136.0" stroke="#c2410c" stroke-width="5" stroke-opacity=".35" marker-end="url(#arc2410c)"/><circle cx="821" cy="136.0" r="9" fill="#c2410c"/><text x="835" y="124.0" font-size="19" font-weight="700" fill="#c2410c" text-anchor="start">≤ $18/h</text><rect x="0" y="168.0" width="1490" height="64" fill="#f9fafb"/><text x="10" y="196.0" font-size="19" fill="#111827"><tspan font-weight="700">A</tspan>  Earns $40,000 a year, full-time</text><text x="34" y="220.0" font-size="15" fill="#6b7280">$40,000 ÷ 2,080 h</text><circle cx="836" cy="200.0" r="9" fill="#6d28d9"/><text x="850" y="188.0" font-size="19" font-weight="700" fill="#6d28d9" text-anchor="start">= $19/h</text><text x="10" y="260.0" font-size="19" fill="#111827"><tspan font-weight="700">H</tspan>  Pays a cleaner $60 for a job that would take 3 h</text><text x="34" y="284.0" font-size="15" fill="#6b7280">$60 ÷ 3 h</text><line x1="845" y1="264.0" x2="1450" y2="264.0" stroke="#0f766e" stroke-width="5" stroke-opacity=".35" marker-end="url(#ar0f766e)"/><circle cx="845" cy="264.0" r="9" fill="#0f766e"/><text x="859" y="252.0" font-size="19" font-weight="700" fill="#0f766e" text-anchor="start">≥ $20/h</text><rect x="0" y="296.0" width="1490" height="64" fill="#f9fafb"/><text x="10" y="324.0" font-size="19" fill="#111827"><tspan font-weight="700">G</tspan>  Turned down an extra Saturday shift at $29/h</text><text x="34" y="348.0" font-size="15" fill="#6b7280">refused $29/h</text><line x1="927" y1="328.0" x2="1450" y2="328.0" stroke="#0f766e" stroke-width="5" stroke-opacity=".35" marker-end="url(#ar0f766e)"/><circle cx="927" cy="328.0" r="9" fill="#0f766e"/><text x="941" y="316.0" font-size="19" font-weight="700" fill="#0f766e" text-anchor="start">≥ $29/h</text><text x="10" y="388.0" font-size="19" fill="#111827"><tspan font-weight="700">B</tspan>  Waited 8 extra min on Lyft to save $4</text><text x="34" y="412.0" font-size="15" fill="#6b7280">$4 ÷ 8 min</text><line x1="935" y1="392.0" x2="690" y2="392.0" stroke="#c2410c" stroke-width="5" stroke-opacity=".35" marker-end="url(#arc2410c)"/><circle cx="935" cy="392.0" r="9" fill="#c2410c"/><text x="949" y="380.0" font-size="19" font-weight="700" fill="#c2410c" text-anchor="start">≤ $30/h</text><rect x="0" y="424.0" width="1490" height="64" fill="#f9fafb"/><text x="10" y="452.0" font-size="19" fill="#111827"><tspan font-weight="700">D</tspan>  Pays a $9 toll to save 15 min on the commute</text><text x="34" y="476.0" font-size="15" fill="#6b7280">$9 ÷ 15 min</text><line x1="976" y1="456.0" x2="1450" y2="456.0" stroke="#0f766e" stroke-width="5" stroke-opacity=".35" marker-end="url(#ar0f766e)"/><circle cx="976" cy="456.0" r="9" fill="#0f766e"/><text x="990" y="444.0" font-size="19" font-weight="700" fill="#0f766e" text-anchor="start">≥ $36/h</text><text x="10" y="516.0" font-size="19" fill="#111827"><tspan font-weight="700">E</tspan>  Circled 20 min for free parking instead of a $15 garage</text><text x="34" y="540.0" font-size="15" fill="#6b7280">$15 ÷ 20 min</text><line x1="1026" y1="520.0" x2="690" y2="520.0" stroke="#c2410c" stroke-width="5" stroke-opacity=".35" marker-end="url(#arc2410c)"/><circle cx="1026" cy="520.0" r="9" fill="#c2410c"/><text x="1040" y="508.0" font-size="19" font-weight="700" fill="#c2410c" text-anchor="start">≤ $45/h</text><rect x="0" y="552.0" width="1490" height="64" fill="#f9fafb"/><text x="10" y="580.0" font-size="19" fill="#111827"><tspan font-weight="700">F</tspan>  Paid $35 for valet on a date (saves ~10 min)</text><text x="34" y="604.0" font-size="15" fill="#6b7280">$35 ÷ 10 min  ·  also a date</text><line x1="1370" y1="584.0" x2="1450" y2="584.0" stroke="#0f766e" stroke-width="5" stroke-opacity=".35" marker-end="url(#ar0f766e)"/><circle cx="1370" cy="584.0" r="9" fill="#0f766e"/><text x="1356" y="572.0" font-size="19" font-weight="700" fill="#0f766e" text-anchor="end">≥ $210/h</text><line x1="690" y1="630" x2="1450" y2="630" stroke="#374151"/><line x1="690" y1="630" x2="690" y2="636" stroke="#374151"/><text x="690" y="656" font-size="15" text-anchor="middle" fill="#374151">$10</text><line x1="781" y1="630" x2="781" y2="636" stroke="#374151"/><text x="781" y="656" font-size="15" text-anchor="middle" fill="#374151">$15</text><line x1="845" y1="630" x2="845" y2="636" stroke="#374151"/><text x="845" y="656" font-size="15" text-anchor="middle" fill="#374151">$20</text><line x1="935" y1="630" x2="935" y2="636" stroke="#374151"/><text x="935" y="656" font-size="15" text-anchor="middle" fill="#374151">$30</text><line x1="1050" y1="630" x2="1050" y2="636" stroke="#374151"/><text x="1050" y="656" font-size="15" text-anchor="middle" fill="#374151">$50</text><line x1="1205" y1="630" x2="1205" y2="636" stroke="#374151"/><text x="1205" y="656" font-size="15" text-anchor="middle" fill="#374151">$100</text><line x1="1359" y1="630" x2="1359" y2="636" stroke="#374151"/><text x="1359" y="656" font-size="15" text-anchor="middle" fill="#374151">$200</text><line x1="1450" y1="630" x2="1450" y2="636" stroke="#374151"/><text x="1450" y="656" font-size="15" text-anchor="middle" fill="#374151">$300</text><text x="1070" y="682" font-size="15" text-anchor="middle" fill="#6b7280">implied value of one hour (log scale)</text></svg></div></div></body></html>
